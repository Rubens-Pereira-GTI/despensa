spring:
  application:
    name: despensa

  # Configuração H2 (Comentada)
  # datasource:
  #   url: jdbc:h2:mem:testdb
  #   driver-class-name: org.h2.Driver
  #   username: sa
  #   password:
  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console

  # Configuração PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:54321}/${POSTGRES_DB:despensa_db}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format-sql: true
    open-in-view: false